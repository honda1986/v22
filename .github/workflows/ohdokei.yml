name: 大時計

on:
  workflow_dispatch:
  schedule:
    # JST 07:40〜23:50 を10分おき (UTC-9)
    - cron: '*/10 22-23,0-15 * * *'

concurrency:
  group: ohdokei
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 依存インストール
        run: pip install requests beautifulsoup4
      - name: 買い目を作る
        run: python ohdokei.py --points 6 --window 40 --out ohdokei/data.json
      - name: コミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ohdokei/data.json
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "ohdokei: 更新"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep 8
          done
          exit 1
