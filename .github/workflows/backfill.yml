name: 過去データ収集

on:
  workflow_dispatch:
    inputs:
      days:
        description: '直近何日ぶん取るか(90で約1.3万レース)'
        required: false
        default: '90'
      workers:
        description: '並列数(10推奨。上げすぎると弾かれる)'
        required: false
        default: '10'
      minutes:
        description: '打ち切り時間(分)。途中で止まっても再実行で続きから'
        required: false
        default: '300'

concurrency:
  group: kyotei-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存インストール
        run: pip install requests beautifulsoup4

      - name: 収集
        run: |
          python backfill.py \
            --days ${{ github.event.inputs.days }} \
            --workers ${{ github.event.inputs.workers }} \
            --minutes ${{ github.event.inputs.minutes }} \
            --out raw

      - name: 診断
        run: |
          echo "raw/ のファイル数: $(ls raw | wc -l)"
          du -sh raw || true
          python diag.py --out raw

      - name: コミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "backfill: 過去レースデータ追加"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "push失敗 リトライ $i"; sleep 10
          done
          exit 1
