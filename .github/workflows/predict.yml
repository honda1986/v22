name: 予想更新
on:
  schedule:
    # JSTで 8:00 / 11:00 / 14:00 / 17:00 / 19:00(オッズが動くので複数回)
    - cron: '0 23 * * *'
    - cron: '0 2 * * *'
    - cron: '0 5 * * *'
    - cron: '0 8 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 YYYYMMDD(空欄=本日)'
        required: false
        default: ''
concurrency:
  group: kyotei-write
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 依存インストール
        run: pip install -r requirements.txt
      - name: 予想
        run: python predict.py ${{ github.event.inputs.date }}
      - name: コミット
        if: always()
        run: |
          git config user.name "boat-bot"
          git config user.email "actions@github.com"
          git add races.json
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "predict: 予想を更新"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push成功 (試行 $i)"; exit 0
            fi
            echo "競合のためリトライ $i/6"; sleep 6
          done
          exit 1
