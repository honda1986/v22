name: 確率の配合

on:
  workflow_dispatch:
    inputs:
      from:
        description: '開始日 YYYYMMDD(学習期間 2025-05〜2026-04 は自動で除外)'
        required: false
        default: '20230501'
      split:
        description: '推定と検証の境目 YYYYMMDD'
        required: false
        default: '20250430'
      reverse:
        description: '推定と検証を入れ替える(true で 2026年で推定 → 2024-25で検証)'
        required: false
        default: 'false'
      to:
        description: '終了日 YYYYMMDD(空で最後まで)'
        required: false
        default: ''

concurrency:
  group: kyotei-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  calib:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 依存インストール
        run: pip install -r requirements.txt
      - name: 配合の推定
        run: |
          ARG="--from ${{ github.event.inputs.from }}"
          if [ -n "${{ github.event.inputs.to }}" ]; then
            ARG="$ARG --to ${{ github.event.inputs.to }}"
          fi
          if [ -n "${{ github.event.inputs.split }}" ]; then
            ARG="$ARG --split ${{ github.event.inputs.split }}"
          fi
          if [ "${{ github.event.inputs.reverse }}" = "true" ]; then
            ARG="$ARG --reverse"
          fi
          python calib.py $ARG
      - name: コミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calib.md
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "calib: 確率の配合の推定結果"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            echo "push失敗 リトライ $i"; sleep 10
          done
          exit 1
