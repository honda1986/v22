name: kfile probe

# GitHub Actions から www1.mbrace.or.jp に繋がるかを確認するだけ。
# 何も保存しない。本番を組む前に1回だけ手で回す。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: LZH展開ツール
        timeout-minutes: 5
        run: |
          set -x
          pip install --disable-pip-version-check requests
          if pip install --disable-pip-version-check lhafile; then
            echo "lhafile OK"
          else
            echo "lhafile が入らないので lhasa を試します"
            sudo apt-get install -y --no-install-recommends lhasa
          fi
          python -c "import lhafile; print('lhafile import OK')" || which lha

      - name: 接続確認
        run: python kfile.py --probe
