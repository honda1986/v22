name: 進入コースの検証

on:
  workflow_dispatch:
    inputs:
      n:
        description: '照合レース数(8割は前付けレースを狙って取ります)'
        required: false
        default: '100'
      wait:
        description: 'レース間の待ち(秒)'
        required: false
        default: '0.5'
      minutes:
        description: '打ち切り時間(分)。ここで止めて結果を出します'
        required: false
        default: '45'

concurrency:
  group: kyotei-write
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 依存インストール
        run: pip install requests beautifulsoup4
      - name: 照合
        run: |
          python checkcourse.py \
            --n ${{ github.event.inputs.n }} \
            --wait ${{ github.event.inputs.wait }} \
            --minutes ${{ github.event.inputs.minutes }}
